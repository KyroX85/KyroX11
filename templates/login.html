<!DOCTYPE html>
<html>
<head>
    <title>KyroX AI Dashboard</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: Arial, sans-serif;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 50px;
            border-radius: 15px;
            width: 350px;
            text-align: center;
            color: white;
            box-shadow: 0px 15px 40px rgba(0,0,0,0.4);
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-container h1 {
            margin-bottom: 10px;
        }

        .login-container p {
            font-size: 14px;
            margin-bottom: 30px;
            opacity: 0.8;
        }

        .login-container input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            outline: none;
        }

        .login-container button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #00c6ff;
            color: white;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-container button:hover {
            background: #0072ff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
<div class="login-container">
    <h1>🚀 KyroX</h1>
    <p>AI Powered Business Dashboard</p>

    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
<br>
<a href="/register">Create Account</a>
</div>

</body>
</html>
